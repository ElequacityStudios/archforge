i18n:
  name: "Preparing mirrors and installing the base system"

dontChroot: true
timeout: 3600
verbose: true

script:
  - command: "/usr/bin/bash /etc/calamares/refresh-mirrors.sh"
    timeout: 300
    verbose: true

  - command: "/usr/bin/pacstrap -C /etc/calamares/target-pacman.conf -K ${ROOT} base base-devel linux linux-firmware mkinitcpio intel-ucode amd-ucode networkmanager sudo grub efibootmgr dosfstools e2fsprogs btrfs-progs xfsprogs f2fs-tools ntfs-3g firefox pipewire pipewire-alsa pipewire-pulse wireplumber xdg-desktop-portal reflector"
    timeout: 3600
    verbose: true

  - command: "/usr/bin/bash /etc/calamares/install-extra-packages.sh ${ROOT}"
    timeout: 1800
    verbose: true

  - command: "/usr/bin/install -D -m 644 /etc/xdg/fastfetch/config.jsonc ${ROOT}/etc/xdg/fastfetch/config.jsonc"
    timeout: 60
    verbose: true

  - command: "/usr/bin/install -D -m 644 /usr/share/fastfetch/archforge.txt ${ROOT}/usr/share/fastfetch/archforge.txt"
    timeout: 60
    verbose: true

  - command: "/usr/bin/printf 'en_US.UTF-8 UTF-8\\n' >> ${ROOT}/etc/locale.gen"
    timeout: 60
    verbose: true

  - command: "/usr/bin/arch-chroot ${ROOT} /usr/bin/locale-gen"
    timeout: 120
    verbose: true

  - command: "/usr/bin/printf 'LANG=en_US.UTF-8\\n' > ${ROOT}/etc/locale.conf"
    timeout: 60
    verbose: true

  - command: "/usr/bin/install -D -o root -g root -m 0440 /etc/calamares/10-wheel-nopasswd ${ROOT}/etc/sudoers.d/10-wheel-nopasswd"
    timeout: 60
    verbose: true

  - command: "/usr/bin/systemctl --root=${ROOT} enable NetworkManager.service"
    timeout: 60
    verbose: true

  - command: "/usr/bin/install -D -m 644 /etc/calamares/reflector.conf ${ROOT}/etc/xdg/reflector/reflector.conf"
    timeout: 60
    verbose: true

  - command: "/usr/bin/systemctl --root=${ROOT} enable reflector.timer"
    timeout: 60
    verbose: true
