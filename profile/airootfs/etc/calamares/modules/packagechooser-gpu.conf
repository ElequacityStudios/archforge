mode: optionalmultiple
method: legacy
default: auto

labels:
  step: "Graphics Drivers"

items:
  - id: auto
    name: "Automatic hardware detection"
    description: "Recommended. Detects your graphics hardware and installs suitable drivers. Supports systems with multiple GPUs."
    screenshot: ":/images/no-selection.png"

  - id: amd
    name: "AMD Radeon"
    description: "Mesa, Vulkan, 32-bit Vulkan, and OpenCL support through ROCm and Mesa where supported."
    screenshot: "amd.png"

  - id: nvidia-current
    name: "NVIDIA (Turing and newer)"
    description: "Modern NVIDIA open kernel modules, proprietary userspace, Vulkan, OpenCL and 32-bit gaming support."
    screenshot: "nvidia.png"

  - id: nvidia-580
    name: "NVIDIA 580 Legacy (Maxwell / Pascal / Volta)"
    description: "Proprietary NVIDIA 580 driver with Vulkan, OpenCL and 32-bit gaming support."
    screenshot: "nvidia.png"

  - id: nvidia-470
    name: "NVIDIA 470 Legacy (Kepler)"
    description: "Legacy proprietary NVIDIA driver for GeForce 600 and 700 series GPUs."
    screenshot: "nvidia.png"

  - id: nvidia-390
    name: "NVIDIA 390 Legacy (Fermi)"
    description: "Legacy proprietary driver for GeForce 400 and 500 series GPUs."
    screenshot: "nvidia.png"

  - id: nvidia-340
    name: "NVIDIA 340 Legacy (Tesla)"
    description: "Very old proprietary driver for GeForce 8000 through 300 series GPUs."
    screenshot: "nvidia.png"

  - id: intel
    name: "Intel Graphics"
    description: "Mesa, Vulkan, 32-bit Vulkan, Intel media acceleration and Intel Compute Runtime."
    screenshot: "intel.png"

  - id: virtio
    name: "Virtio GPU"
    description: "Virtio-GPU Vulkan support, including 32-bit Vulkan for virtual machines."
    screenshot: ":/images/no-selection.png"
