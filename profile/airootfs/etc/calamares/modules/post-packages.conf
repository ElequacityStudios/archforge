
dontChroot: false
timeout: 3600
verbose: true

script:
  - command: |
      set -e

      # Install Paru only when the user selected its NetInstall group.
      if /usr/bin/pacman -Q base-devel >/dev/null 2>&1; then
          echo "Paru was selected."

          if ! /usr/bin/pacman -Q paru >/dev/null 2>&1; then
              /usr/bin/bash /usr/local/lib/archforge/install-paru-netinstall.sh
          fi

          # Tell cleanup-paru to retain Paru.
          /usr/bin/install -D -m 0644 /dev/null /var/lib/archforge/paru-selected
      else
          echo "Paru was not selected."
      fi

      # Set the GRUB distribution name before bootloader configuration.
      if [ -f /etc/default/grub ]; then
          sed -i '/^GRUB_DISTRIBUTOR=/d' /etc/default/grub
          printf '%s\n' 'GRUB_DISTRIBUTOR="Archforge"' >> /etc/default/grub
          echo "Set GRUB distributor to Archforge."
      fi
    timeout: 3600
    verbose: true
