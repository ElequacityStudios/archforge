
modules-search: [local]

instances:
  - id: install-system
    module: shellprocess
    config: install-system.conf
    weight: 70

  - id: desktop
    module: packagechooser
    config: packagechooser-desktop.conf
    weight: 75

  - id: gpu
    module: packagechooser
    config: packagechooser-gpu.conf
    weight: 76

  - id: install-options
    module: shellprocess
    config: install-options.conf
    weight: 78

  - id: install-desktop
    module: shellprocess
    config: install-desktop.conf
    weight: 80

  - id: optional-software
    module: netinstall
    config: netinstall.conf
    weight: 77

  - id: cleanup-paru
    module: shellprocess
    config: cleanup-paru.conf
    weight: 85

  - id: post-packages
    module: shellprocess
    config: post-packages.conf
    weight: 82

sequence:
  - show: [welcome, packagechooser@desktop, packagechooser@gpu, netinstall@optional-software, partition, summary]

  - exec: [partition, mount, shellprocess@install-system, shellprocess@install-options, packages, shellprocess@post-packages, shellprocess@cleanup-paru, shellprocess@install-desktop, machineid, fstab, initcpiocfg, initcpio, services-systemd, bootloader, umount]

  - show: [finished]

branding: archforge
prompt-install: false
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
hide-back-and-next-during-exec: false
quit-at-end: false
